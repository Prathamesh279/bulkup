<title>BulkUp – Indian Bulking Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
:root{--bg:#fbf7f1;--card:rgba(255,255,255,.78);--tx:#23201c;--mu:#7a746a;--ac:#ff6b2c;--ac2:#12b76a;--ac3:#7c5cff;--bd:rgba(40,30,20,.09);--sh:0 8px 28px rgba(255,107,44,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e14;--card:rgba(32,30,44,.72);--tx:#f3f1f8;--mu:#a29eb4;--bd:rgba(255,255,255,.08);--sh:0 8px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f0e14;--card:rgba(32,30,44,.72);--tx:#f3f1f8;--mu:#a29eb4;--bd:rgba(255,255,255,.08);--sh:0 8px 28px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.38;animation:float 14s ease-in-out infinite}
body::before{width:300px;height:300px;background:var(--ac);top:-90px;right:-80px}
body::after{width:280px;height:280px;background:var(--ac3);bottom:60px;left:-100px;animation-delay:-7s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.15)}}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:800;margin:6px 0 14px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--ac),var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:16px;font-weight:700;margin:0 0 10px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.anim h1,.anim .card{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.anim .card:nth-child(2){animation-delay:.05s}.anim .card:nth-child(3){animation-delay:.1s}.anim .card:nth-child(4){animation-delay:.15s}.anim .card:nth-child(5){animation-delay:.2s}.anim .card:nth-child(6){animation-delay:.25s}.anim .card:nth-child(n+7){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.98)}}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.big{font-size:30px;font-weight:800}
.rings{display:flex;justify-content:space-around;gap:6px;margin-bottom:10px}
.rw{position:relative;width:46%;max-width:170px}
.rw svg{width:100%;display:block}.rb{fill:none;stroke:var(--bd);stroke-width:10}
.rg{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:var(--o);animation:ring 1.3s cubic-bezier(.3,.8,.3,1) both;filter:drop-shadow(0 0 5px currentColor)}
@keyframes ring{from{stroke-dashoffset:327}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rc b{font-size:26px;font-weight:800;line-height:1}.rc span{font-size:11px;color:var(--mu);margin-top:3px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ffb347);border-radius:6px}
button,input,select{font:inherit;color:var(--tx)}
button{background:linear-gradient(135deg,var(--ac),#ff9a3c);color:#fff;border:0;border-radius:14px;padding:9px 14px;font-weight:600;box-shadow:0 4px 14px rgba(255,107,44,.3);transition:transform .15s,box-shadow .15s}
button:active{transform:scale(.92)}button:disabled{opacity:.6;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.9;transform:scale(.97)}}
button.g{background:var(--bd);color:var(--tx);box-shadow:none}
input,select{background:var(--bd);border:1px solid transparent;border-radius:12px;padding:9px;width:100%;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,107,44,.18)}
input[type=checkbox]{width:auto;accent-color:var(--ac2)}input[type=range]{accent-color:var(--ac);padding:0}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{font-size:12px;color:var(--mu)}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(92%,520px);background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;display:flex;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.18);z-index:9}
nav button{flex:1;background:none;color:var(--mu);border-radius:20px;padding:7px 2px;font-size:11px;font-weight:600;box-shadow:none;transition:all .25s}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--ac),#ff9a3c);box-shadow:0 4px 14px rgba(255,107,44,.35)}
nav b{display:block;font-size:19px}nav button.on b{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--bd);animation:slide .35s both}
.it:first-of-type{border-top:0}.it small{display:block;color:var(--mu)}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}}
.q{width:60px;text-align:center}
.tag{display:inline-block;background:linear-gradient(135deg,rgba(18,183,106,.18),rgba(124,92,255,.18));border-radius:20px;padding:3px 11px;font-size:12px;margin:3px 3px 0 0;animation:pop .5s both}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.dots i{width:16px;height:22px;border-radius:4px 4px 8px 8px;background:var(--bd);transition:all .35s}
.dots i.on{background:linear-gradient(#5ac8fa,#2f80ed);transform:translateY(-2px);box-shadow:0 3px 8px rgba(47,128,237,.4)}
#q{margin-bottom:12px}svg{width:100%;height:auto}.chl{stroke-dasharray:900;animation:draw 1.6s ease both}@keyframes draw{from{stroke-dashoffset:900}}
img{animation:up .5s both}
ul{padding-left:18px;margin:6px 0}li{margin-bottom:6px}
.warn{background:linear-gradient(135deg,#fff3bf,#ffe0b2);color:#5c4500;border-radius:16px;padding:12px;font-size:13px}
.hi{font-size:13px;color:var(--mu);margin-bottom:-6px}
.hero{background:linear-gradient(135deg,rgba(255,107,44,.22),rgba(124,92,255,.22))}
.lvl{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 0 18px rgba(124,92,255,.5);flex:none}
.flame{font-size:26px;display:inline-block;animation:flick 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{50%{transform:scale(1.18) rotate(-6deg)}}
.xp{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:5px}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--ac3),var(--ac2));border-radius:6px;animation:grow 1.2s both}
@keyframes grow{from{width:0}}
.qt{font-style:italic;color:var(--mu);font-size:13px;margin-top:10px}
.qs{display:flex;align-items:center;gap:10px;padding:7px 0}.qs .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none;font-size:14px;transition:all .3s}
.qs.d .ck{background:var(--ac2);border-color:var(--ac2);color:#fff;animation:pop .5s}.qs .bar{height:6px;margin:4px 0 0}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bg div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--bd);font-size:11px;filter:grayscale(1);opacity:.45;transition:.3s}
.bg div.on{filter:none;opacity:1;background:linear-gradient(135deg,rgba(255,107,44,.2),rgba(124,92,255,.2));animation:pop .6s}.bg b{display:block;font-size:26px}
.chip{display:inline-block;margin:3px 4px 0 0;padding:6px 11px;font-size:12px;border-radius:20px;background:var(--bd);color:var(--tx);box-shadow:none}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;padding:11px 18px;border-radius:30px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .5s cubic-bezier(.3,1.4,.5,1);max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const F=[ // name, unit, kcal, protein
["Roti / chapati","1 pc",105,3],["Roti with ghee","1 pc",135,3],["Plain paratha","1 pc",220,5],["Aloo paratha","1 pc",290,6],
["Rice (cooked)","1 katori",195,4],["Dal tadka","1 katori",150,8],["Rajma","1 katori",190,10],["Chole","1 katori",210,10],
["Sambar","1 katori",100,5],["Khichdi","1 katori",210,7],["Mixed veg sabzi","1 katori",120,3],["Aloo sabzi","1 katori",160,3],
["Paneer (raw)","100 g",265,18],["Paneer bhurji","1 katori",260,16],["Palak paneer","1 katori",240,11],
["Egg, boiled","1 egg",75,6.5],["Omelette (2 eggs)","1 serving",190,13],["Chicken curry","1 katori",230,22],
["Tandoori / grilled chicken","100 g",165,27],["Fish curry","1 katori",200,20],["Chicken biryani","1 plate",490,24],["Veg biryani","1 plate",400,9],
["Curd / dahi","1 katori",100,5],["Milk (full cream)","1 glass 250ml",160,8],["Sweet lassi","1 glass",200,6],["Buttermilk","1 glass",40,2],
["Soya chunks (dry wt)","50 g",170,26],["Sprouts","1 bowl",110,8],["Besan chilla","1 pc",130,6],["Sattu drink","1 glass",110,7],
["Poha","1 plate",270,6],["Upma","1 plate",250,6],["Idli","2 pcs",130,4],["Plain dosa","1 pc",130,3],["Masala dosa","1 pc",250,5],
["Oats cooked in milk","1 bowl",250,10],["Bread slice","1 slice",80,3],["Peanut butter","1 tbsp",95,4],["Peanuts","30 g",170,8],
["Roasted chana","30 g",110,6],["Almonds","10 pcs",70,2.5],["Cashews","10 pcs",90,3],["Dates","3 pcs",70,0.6],["Banana","1 medium",105,1.3],
["Mango","1 cup",100,1],["Ghee","1 tsp",45,0],["Peanut chikki","1 pc",120,3],["Whey protein","1 scoop 30g",120,24],
["Banana-peanut butter milkshake","1 glass",420,16]];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=()=>new Date().toLocaleDateString('en-CA'),K='bulkup1';
let S={p:{w:48,h:170,a:22,act:1.55,goal:55,sur:500},log:{},wt:[],water:{},cf:[]},tab='today',q='',scan={items:[],busy:0,msg:'',img:null};
try{let x=JSON.parse(localStorage.getItem(K));if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const all=()=>F.concat(S.cf.map(c=>[c[0],c[1],c[2],c[3]]));
const curW=()=>S.wt.length?S.wt[S.wt.length-1].w:S.p.w;
function calc(w=curW()){const p=S.p,bmr=10*w+6.25*p.h-5*p.a+5,tdee=bmr*p.act;return{bmr,tdee,tgt:Math.round(tdee+p.sur),prot:Math.round(2*w)}}
const tot=d=>(S.log[d]||[]).reduce((a,e)=>({k:a.k+e.k*e.q,p:a.p+e.p*e.q}),{k:0,p:0});
function eta(){const p=S.p,c=calc(),left=p.goal-curW();if(left<=0)return{t:"🎉 Goal reached! Raise your goal weight."};
 const days=Object.keys(S.log).sort().slice(-8).filter(d=>d!==day()&&tot(d).k>500),
 avg=days.length?days.reduce((a,d)=>a+tot(d).k,0)/days.length:null;
 const mk=(sur,l)=>{if(sur<=0)return l+": at this intake you won't gain — eat more.";const wk=sur*7/7700,wks=left/wk;return`${l}: ~${wk.toFixed(2)} kg/week → <b>${Math.ceil(wks)} weeks</b> (~${(wks/4.33).toFixed(1)} months) to reach ${p.goal} kg`};
 return{plan:mk(p.sur,"If you hit your target daily"),act:avg?mk(avg-c.tdee,`Your real avg (${Math.round(avg)} kcal, last ${days.length} days)`):"Log a few full days to get an estimate based on what you actually eat."}}
const bar=(v,m,c='')=>`<div class="bar ${c}"><i style="width:${Math.min(100,m?v/m*100:0)}%"></i></div>`;
const addE=(n,u,k,p,qty,m)=>{(S.log[day()]=S.log[day()]||[]).push({n,u,k,p,q:+qty||1,m:m||slot()});save();render()};
const slot=()=>{let h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<19?'Snack':'Dinner'};
function fillers(rp){return all().filter(f=>f[3]>=5&&f[2]<350).sort((a,b)=>b[3]/b[2]-a[3]/a[2]).slice(0,5)}
const ring=(v,m,col,l,ic)=>`<div class="rw"><svg viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52"/><circle class="rg" style="--o:${327*(1-Math.min(1,Math.max(.01,v/m)))};stroke:${col};color:${col}" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"/></svg><div class="rc"><span style="font-size:16px">${ic}</span><b data-n="${Math.round(v)}">${Math.round(v)}</b><span>${l}</span><span>/ ${m}</span></div></div>`;
function today(){const c=calc(),t=tot(day()),L=S.log[day()]||[],rk=c.tgt-t.k,rp=c.prot-t.p,wa=S.water[day()]||0,e=eta();
 const g={};L.forEach((x,i)=>(g[x.m]=g[x.m]||[]).push([x,i]));
 return`<div class="hi">${slot()==='Breakfast'?'Good morning':slot()==='Lunch'?'Good afternoon':'Good evening'} 👋 keep fuelling</div><h1>Today</h1>${hero()}<div class="card"><div class="rings">${ring(t.k,c.tgt,'var(--ac)','kcal eaten','🔥')}${ring(t.p,c.prot,'var(--ac2)','g protein','💪')}</div>
 <div>${rk>0?`<b>${Math.round(rk)} kcal</b> and <b>${Math.max(0,Math.round(rp))} g protein</b> still to eat.`:'✅ Calorie target hit! Great job.'}</div>
 ${rp>10?`<div class="mu" style="margin-top:8px">Protein-rich picks to close the gap:</div>${fillers(rp).map(f=>`<span class="tag">${esc(f[0])} (${f[3]}g)</span>`).join('')}`:''}</div>
 ${quests()}${recent()}
 <div class="card"><div class="row sp"><div><h2>💧 Water</h2><span class="mu">${(wa*.25).toFixed(2)} / 3.5 L</span></div><div class="row"><button class="g" onclick="wat(-1)">−</button><button onclick="wat(1)">+ glass</button></div></div><div class="dots">${[...Array(14)].map((_,i)=>`<i class="${i<wa?'on':''}"></i>`).join('')}</div></div>
 <div class="card"><h2>🎯 Time to ${S.p.goal} kg</h2><div class="mu">Now ${curW()} kg</div>${e.t?e.t:`<p>${e.plan}</p><p>${e.act}</p>`}</div>
 ${['Breakfast','Lunch','Snack','Dinner'].map(m=>`<div class="card"><h2>${m}</h2>${(g[m]||[]).map(([x,i])=>`<div class="it"><div>${esc(x.n)} ×${x.q}<small>${esc(x.u)} · ${Math.round(x.k*x.q)} kcal · ${(x.p*x.q).toFixed(0)}g P</small></div><button class="g" onclick="del(${i})">✕</button></div>`).join('')||'<span class="mu">Nothing logged</span>'}</div>`).join('')}`}
const wat=n=>{S.water[day()]=Math.max(0,(S.water[day()]||0)+n);save();render()},del=i=>{S.log[day()].splice(i,1);save();render()};
function foods(){const l=all().filter(f=>f[0].toLowerCase().includes(q.toLowerCase()));
 return`<h1>🍛 Add food</h1><input id="q" placeholder="Search roti, dal, paneer, egg…" value="${esc(q)}" oninput="q=this.value;fl()">${recent()}<div class="card" id="fl">${fl(1)}</div>
 <div class="card"><h2>➕ Custom food</h2><div class="f"><input id="cn" placeholder="Name"><input id="cu" placeholder="Serving (1 bowl)"><input id="ck" type="number" placeholder="kcal"><input id="cp" type="number" placeholder="Protein g"></div><button style="margin-top:8px" onclick="cust()">Save food</button></div>`}
function fl(r){const l=all().map((f,i)=>[f,i]).filter(([f])=>f[0].toLowerCase().includes(q.toLowerCase())).slice(0,40),h=l.map(([f,i])=>`<div class="it"><div>${esc(f[0])}<small>${esc(f[1])} · ${f[2]} kcal · ${f[3]}g P</small></div><div class="row"><input class="q" id="n${i}" type="number" value="1" min="0.5" step="0.5"><button onclick="ad(${i})">+</button></div></div>`).join('')||'<span class="mu">No match — add it below</span>';if(r)return h;$('#fl').innerHTML=h}
const ad=i=>{const f=all()[i];addE(f[0],f[1],f[2],f[3],$('#n'+i).value)};
function cust(){const n=$('#cn').value.trim(),k=+$('#ck').value;if(!n||!k)return;S.cf.push([n,$('#cu').value||'1 serving',k,+$('#cp').value||0]);save();render()}
function scanV(){const sm=scan.items.length;return`<h1>📸 AI food scan</h1><div class="card"><p class="mu" style="margin-top:0">Take a photo of your thali/plate. Claude estimates items, portions, calories and protein. Always check portions — estimates can be off by 20–30%.</p>
 ${scan.cam?`<video id="vid" autoplay playsinline muted style="width:100%;border-radius:10px;background:#000"></video><div class="row" style="margin-top:8px"><button onclick="snap()">📸 Capture & analyse</button><button class="g" onclick="stopCam();render()">Cancel</button></div>`:`<div class="row"><button onclick="startCam()">📷 Open camera</button><label class="g" style="flex:1;text-align:center;background:var(--bd);border-radius:10px;padding:8px;font-weight:600">🖼 Gallery<input type="file" id="ph" accept="image/*" hidden onchange="pick(this)"></label></div>`}${scan.img&&!scan.cam?`<img src="${scan.img}" style="width:100%;border-radius:10px;margin-top:8px">`:''}
 <input id="ds" style="margin-top:8px" placeholder="Optional hint: e.g. 2 roti, 1 katori dal, paneer sabzi">
 <div class="row" style="margin-top:8px"><button onclick="run()" ${scan.busy?'disabled':''}>${scan.busy?'Analysing…':'Re-analyse'}</button></div><p class="mu">${esc(scan.msg)}</p></div>
 ${sm?`<div class="card"><h2>Detected</h2>${scan.items.map((x,i)=>`<div class="it"><div><label class="row"><input type="checkbox" id="s${i}" checked> ${esc(x.name)}</label><small>${esc(x.portion)} · ${Math.round(x.kcal)} kcal · ${x.protein}g P</small></div><input class="q" id="m${i}" type="number" value="1" step="0.25" min="0.25" title="portion multiplier"></div>`).join('')}<button style="margin-top:8px" onclick="addScan()">Add selected to today</button></div>`:''}`}
let file=null;scan.cam=null;
function pick(el){file=el.files[0];if(file){scan.img=URL.createObjectURL(file);scan.items=[];run()}}
async function startCam(){scan.msg='';try{scan.cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});render();$('#vid').srcObject=scan.cam}catch(e){scan.cam=null;scan.msg='Camera not available or permission denied here — use Gallery, which opens your phone camera/photos.';render()}}
function stopCam(){if(scan.cam){scan.cam.getTracks().forEach(t=>t.stop());scan.cam=null}}
function snap(){const v=$('#vid');if(!v||!v.videoWidth)return;const c=document.createElement('canvas'),r=Math.min(1,1280/v.videoWidth);c.width=v.videoWidth*r;c.height=v.videoHeight*r;c.getContext('2d').drawImage(v,0,0,c.width,c.height);
 c.toBlob(b=>{file=b;scan.img=URL.createObjectURL(b);scan.items=[];stopCam();run()},'image/jpeg',.85)}
async function run(){const sample=await claude.use('sample').catch(()=>null);
 if(!sample){scan.msg='AI scan needs this page opened in claude.ai (link from Claude). Use the Foods tab meanwhile.';return render()}
 const hint=($('#ds')||{}).value||'';if(!file&&!hint){scan.msg='Add a photo or a text description first.';return render()}
 scan.busy=1;scan.msg='';render();
 try{const o={modelTier:'default'};if(file)o.images=file;
 const r=await sample.json(`You are a nutritionist expert in Indian home food. ${file?'Identify every food item in the photo.':''} User hint: "${hint}". For each item estimate the visible portion using Indian units (katori≈150ml, roti≈40g, glass≈250ml) and give TOTAL kcal and protein grams for that portion. Be realistic and include cooking oil/ghee. Respond ONLY with JSON: {"items":[{"name":"","portion":"","kcal":0,"protein":0}]}`,o);
 scan.items=(r.items||[]).filter(x=>x&&x.name&&isFinite(x.kcal));scan.msg=scan.items.length?'':'Could not detect food — try a clearer photo or add a hint.'}
 catch(e){scan.msg='Scan failed ('+(e.code||'error')+'). '+(e.code==='images_unavailable'?'Photos are not supported here — type a description instead.':'Try again.')}
 scan.busy=0;render()}
function addScan(){S.sc=(S.sc||0)+1;scan.items.forEach((x,i)=>{if($('#s'+i).checked)addE(x.name,x.portion,+x.kcal,+x.protein,$('#m'+i).value)});scan.items=[];scan.img=null;file=null;scan.msg='';tab='today';render()}
function prog(){const p=S.p,c=calc(),w=S.wt.slice(-30);let ch='';
 if(w.length>1){const mn=Math.min(...w.map(x=>x.w))-1,mx=Math.max(...w.map(x=>x.w),p.goal)+1,X=i=>20+i*(300/(w.length-1)),Y=v=>110-(v-mn)/(mx-mn)*100;
 ch=`<svg viewBox="0 0 340 125"><line x1="20" x2="320" y1="${Y(p.goal)}" y2="${Y(p.goal)}" stroke="var(--ac2)" stroke-dasharray="4"/><polyline class="chl" fill="none" stroke="var(--ac)" stroke-width="3" points="${w.map((x,i)=>X(i)+','+Y(x.w)).join(' ')}"/>${w.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="3" fill="var(--ac)"/>`).join('')}<text x="22" y="${Y(p.goal)-4}" font-size="9" fill="var(--ac2)">goal ${p.goal}kg</text></svg>`}
 const inp=(k,l,s='')=>`<div><label>${l}</label><input type="number" step="${s||1}" value="${p[k]}" onchange="S.p.${k}=+this.value;save();render()"></div>`;
 return`<h1>📈 Progress & Settings</h1><div class="card"><h2>Weigh-in</h2><div class="row"><input id="wi" type="number" step="0.1" placeholder="Weight kg (e.g. ${curW()})"><button onclick="wlog()">Log</button></div><p class="mu">Weigh weekly, same day, morning, after toilet, before food.</p>${ch}
 ${S.wt.slice(-5).reverse().map(x=>`<div class="it"><span>${x.d}</span><b>${x.w} kg</b></div>`).join('')}</div>
 <div class="card"><h2>Your numbers</h2><div class="f">${inp('h','Height (cm)')}${inp('a','Age')}${inp('goal','Goal weight (kg)','0.5')}
 <div><label>Activity</label><select onchange="S.p.act=+this.value;save();render()">${[[1.375,'Light (1-3 gym days)'],[1.55,'Moderate (3-5 days)'],[1.725,'Very active']].map(a=>`<option value="${a[0]}" ${a[0]==S.p.act?'selected':''}>${a[1]}</option>`).join('')}</select></div></div>
 <label class="mu">Daily surplus: <b>+${p.sur} kcal</b></label><input type="range" min="250" max="800" step="50" value="${p.sur}" oninput="S.p.sur=+this.value;save();render()">
 <p>BMR <b>${Math.round(c.bmr)}</b> · Maintenance <b>${Math.round(c.tdee)}</b> · <b>Target ${c.tgt} kcal</b> · Protein <b>${c.prot} g</b> (2 g/kg) · Fat ~${Math.round(c.tgt*.27/9)} g · Carbs ~${Math.round((c.tgt-c.prot*4-c.tgt*.27)/4)} g</p>
 <p class="mu">Targets update automatically as your weight changes. A +300–500 kcal surplus (≈0.25–0.5 kg/week) builds muscle with least fat; very fast gain is mostly fat.</p></div>
 ${badges()}<div class="card"><h2>Last 7 days</h2>${[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-i*864e5).toLocaleDateString('en-CA'),t=tot(d);return`<div class="it"><span>${d.slice(5)}</span><span>${Math.round(t.k)} kcal · ${Math.round(t.p)}g P ${t.k>=c.tgt*.95?'✅':''}</span></div>`}).join('')}</div>`}
function wlog(){const v=+$('#wi').value;if(!v||v<25||v>200)return;const d=day(),i=S.wt.findIndex(x=>x.d===d);i>=0?S.wt[i].w=v:S.wt.push({d,w:v});save();render()}
function tips(){const c=calc();return`<h1>🧠 Grow faster</h1><div class="card"><h2>Easy high-calorie Indian add-ons</h2><ul><li>Add 1 tsp <b>ghee</b> on roti/rice/dal (+45 kcal each time).</li><li>Switch to <b>full-cream milk</b>; drink 2 glasses/day.</li><li>Banana + peanut butter shake before bed (~420 kcal, 16 g P).</li><li>Handful of peanuts, dates, almonds as snacks between meals.</li><li>Paneer / egg / soya chunks / chicken in at least 3 meals.</li><li>Eat <b>5–6 times</b>: you won't hit ${c.tgt} kcal in 3 meals when you're small.</li><li>Liquid calories (lassi, shakes) are easier than eating more rice.</li></ul></div>
 <div class="card"><h2>Sample day (~2700 kcal, veg + egg)</h2><ul><li>Breakfast: 2 aloo-paratha-or-roti + 3 eggs omelette + milk</li><li>Snack: banana-peanut shake</li><li>Lunch: 3 roti w/ ghee + rice + dal + paneer sabzi + curd</li><li>Evening: peanuts + roasted chana + dates</li><li>Dinner: 3 roti + soya/chicken curry + sabzi + rice</li><li>Bedtime: milk glass + 5 almonds</li></ul></div>
 <div class="card"><h2>Training & recovery</h2><ul><li>Lift <b>3–4 days/week</b>: squat, deadlift, bench, overhead press, rows, pull-ups. Add weight or reps every week (progressive overload).</li><li>Sleep <b>7–9 hours</b>; muscle is built during recovery.</li><li>Spread protein: ~25–30 g every meal.</li><li>If weight doesn't rise ~0.25 kg/week for 2–3 weeks, add ~200 kcal.</li><li>Creatine monohydrate 3–5 g/day is well-researched (ask a doctor first).</li><li>Eat 30 min after training; don't skip meals.</li></ul></div>
 <div class="warn">At 48 kg you may be underweight. If you also have poor appetite, tiredness or frequent illness, see a doctor or dietitian to rule out issues (thyroid, worms, deficiency, e.g., B12/iron/vitamin D). This app gives estimates, not medical advice.</div>`}
const T=[['today','🏠','Today'],['foods','🍛','Foods'],['scan','📸','Scan'],['prog','📈','Progress'],['tips','🧠','Tips']];

const ymd=i=>new Date(Date.now()-i*864e5).toLocaleDateString('en-CA'),hit=d=>{const t=tot(d);return t.k>0&&t.k>=calc().tgt*.9};
function streaks(){let cur=0,best=0,run=0,i=hit(ymd(0))?0:1,go=1;for(let j=0;j<150;j++){if(hit(ymd(j))){run++;best=Math.max(best,run)}else run=0}
 while(i<150&&hit(ymd(i))){cur++;i++}return{cur,best}}
function xp(){const c=calc();let x=S.wt.length*25+(S.sc||0)*10;Object.keys(S.log).forEach(d=>{const t=tot(d);x+=Math.min(S.log[d].length,6)*5+(t.k>=c.tgt*.9?40:0)+(t.p>=c.prot*.9?40:0)+((S.water[d]||0)>=14?20:0)});return x}
const TT=['Rookie','Gym Newbie','Iron Initiate','Lifter','Gainer','Mass Builder','Beast','Titan','Legend','Immortal'],QU=["Every meal is a rep. Make it count.","Muscle is built in the kitchen and the gym.","Small surplus, big results.","Eat. Lift. Sleep. Repeat.","Today's plate is tomorrow's strength.","Consistency beats intensity.","You're not skinny, you're a work in progress.","One more roti. One more rep.","Growth is a habit, not a hack.","Your future physique is watching your next meal."];
function lv(){const x=xp(),L=Math.floor(Math.sqrt(x/50))+1,b=50*(L-1)**2,n=50*L*L;return{x,L,t:TT[Math.min(L-1,9)],f:(x-b)/(n-b),n:n-x}}
function hero(){const l=lv(),st=streaks(),sw=S.wt.length?S.wt[0].w:S.p.w,pc=Math.max(0,Math.min(1,(curW()-sw)/Math.max(.1,S.p.goal-sw)));
 return`<div class="card hero"><div class="row"><div class="lvl">${l.L}</div><div style="flex:1"><b>${l.t}</b> <span class="mu">· ${l.x} XP</span><div class="xp"><i style="width:${l.f*100}%"></i></div><div class="mu">${l.n} XP to level ${l.L+1}</div></div><div style="text-align:center"><span class="flame">${st.cur?'🔥':'🕯️'}</span><div style="font-weight:800">${st.cur}</div><div class="mu" style="font-size:10px">day streak</div></div></div>
 <div class="mu" style="margin-top:10px">Journey: ${sw} → ${S.p.goal} kg · ${Math.round(pc*100)}%</div><div class="xp"><i style="width:${pc*100}%"></i></div><div class="qt">“${QU[new Date().getDate()%QU.length]}”</div></div>`}
function quests(){const c=calc(),t=tot(day()),n=(S.log[day()]||[]).length,wa=S.water[day()]||0,Q=[['🔥','Hit calorie target',t.k,c.tgt*.9,c.tgt],['💪','Hit protein goal',t.p,c.prot*.9,c.prot],['💧','Drink 3.5 L water',wa,14,14],['🍽️','Log 4+ foods',n,4,4]],d=Q.filter(q=>q[2]>=q[3]).length;
 return`<div class="card"><div class="row sp"><h2>Daily quests</h2><span class="mu">${d}/4 ${d==4?'🏆':''}</span></div>${Q.map(q=>`<div class="qs ${q[2]>=q[3]?'d':''}"><div class="ck">${q[2]>=q[3]?'✓':''}</div><div style="flex:1">${q[0]} ${q[1]}${bar(q[2],q[4])}</div></div>`).join('')}</div>`}
let RC=[];function recent(){const seen={};RC=[];Object.keys(S.log).sort().reverse().forEach(d=>S.log[d].slice().reverse().forEach(e=>{if(!seen[e.n]&&RC.length<7){seen[e.n]=1;RC.push(e)}}));
 return RC.length?`<div class="card"><h2>⚡ Quick add (recent)</h2>${RC.map((e,i)=>`<button class="chip" onclick="qa(${i})">+ ${esc(e.n)}</button>`).join('')}</div>`:''}
const qa=i=>{const e=RC[i];addE(e.n,e.u,e.k,e.p,1)};
function badges(){const st=streaks(),sw=S.wt.length?S.wt[0].w:S.p.w,g=curW()-sw,D=Object.keys(S.log),B=[['🍽️','First meal',D.length>0],['🔥','3-day streak',st.best>=3],['⚡','7-day streak',st.best>=7],['💪','Protein pro',D.some(d=>tot(d).p>=calc().prot*.9)],['💧','Hydrated',D.some(d=>(S.water[d]||0)>=14)],['📸','Scanner',(S.sc||0)>0],['📈','+1 kg',g>=1],['🏋️','+3 kg',g>=3],['🏆','Goal reached',curW()>=S.p.goal&&S.wt.length>1]];
 return`<div class="card"><h2>🏅 Badges ${B.filter(b=>b[2]).length}/${B.length}</h2><div class="bg">${B.map(b=>`<div class="${b[2]?'on':''}"><b>${b[0]}</b>${b[1]}</div>`).join('')}</div></div>`}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='on';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',3200)}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d'),P=[...Array(130)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,s:5+Math.random()*6,r:Math.random()*6,c:`hsl(${Math.random()*360},90%,60%)`}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<170)requestAnimationFrame(a);else c.remove()})()}
function celeb(){S.cel=S.cel||{};const c=calc(),t=tot(day()),d=day();let m='';
 if(t.k>=c.tgt*.9&&!S.cel['c'+d]){S.cel['c'+d]=1;m='🔥 Calorie target smashed! +40 XP'}
 else if(t.p>=c.prot*.9&&!S.cel['p'+d]){S.cel['p'+d]=1;m='💪 Protein goal done! +40 XP'}
 const L=lv().L;if(S.lv&&L>S.lv)m=`🎉 Level up! You're now ${TT[Math.min(L-1,9)]}`;if(S.lv!==L)S.lv=L;
 if(m){save();confetti();toast(m)}else save()}
let lastTab;
function countUp(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1100);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function render(){if(tab!=='scan')stopCam();const y=window.scrollY;$('#app').className=tab!==lastTab?'anim':'';$('#app').innerHTML={today,foods,scan:scanV,prog,tips}[tab]();
 $('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)"><b>${t[1]}</b>${t[2]}</button>`).join('');scrollTo(0,y);lastTab=tab;countUp();if(tab==='today')celeb()}
render();

// PWA: register service worker for offline + install
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script></body></html>
